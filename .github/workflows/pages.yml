name: Publish dashboard and refresh weekly data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 0"

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh public reference prices
        id: market
        continue-on-error: true
        run: python scripts/update_market.py
      - name: Retain dated snapshot for the next refresh
        run: |
          if ! git diff --quiet -- public/market.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/market.json
            git commit -m 'Refresh dated public market snapshot'
            git push
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Report unavailable market feed
        if: steps.market.outcome == 'failure'
        run: echo '::warning::Market refresh failed. The dashboard keeps old quote dates and displays a refresh warning.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
